spring.application.name=clinicawisestart
spring.config.import=optional:file:.env[.properties]

# encoding do tomcat
server.tomcat.uri-encoding=UTF-8

# porta do servidor
server.port=8080

# conexao com o PostgreSQL na VPS
spring.datasource.url=jdbc:postgresql://apiceodontologia.ddns.net:5432/sistema_gestao_consultas
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# mantem o schema sob controle dos scripts/migrations do projeto
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# chave usada para assinar JWT em desenvolvimento; em producao usar variavel de ambiente
api.security.jwt.secret=${JWT_SECRET:dev-secret-change-before-production}
api.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
